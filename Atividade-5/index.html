<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    form {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        border: 2px solid #E2E8F0;
        border-radius: 5px;
        padding: 20px;
        width: fit-content;
        margin: 0 auto;
        background-color: #F4F6F9;
    }
    input:focus{
        border: 2px solid #3B82F6;
        background-color: aliceblue;
        outline: none;
    }

    input {
        border-radius: 5px;
        border: 2px solid #CBD5E1;
        padding: 5px 10px;
        margin-bottom: 15px;
        
    }

    input[type="radio"] {
        margin-bottom: 0px;
        padding: 0px;
        width: auto;
    }

    label[for="interesses"] {
        display: inline-block;
        margin-top: 15px;
        box-sizing: border-box;
    }

    .botao-enviar:hover {
        background-color: #1D4ED8;
    }

    .botao-enviar {
        border-radius: 5px;
        font-size: 18px;
        background-color: #3B82F6;
        color: white;
        border: 2px solid black;
    }
   @media (max-width: 480px) {
        form {
            width: 90%;
            padding: 15px;
        }
   } 
</style>
<body>
    <form>
        <label for="name">Nome: </label> <br>
        <input type="text" id="name" name="userName"> <br> 

        <label for="email">E-mail: </label> <br>
        <input type="email" id="email" name="userEmail"> <br> 

        <label for="password">Senha: </label> <br>
        <input type="password" id="password" name="userPassword"> <br>

        <label for="dataNasc">Data de nascimento: </label> <br>
        <input type="date" id="dataNasc" name="userDataNasc"> <br>

        <label for="curso">Curso: </label> <br>
        <input type="text" id="curso" name="userCurso"> <br>

        <label for="sexo">Sexo: </label> <br>
        <input type="radio" id="masculino" name="userSexo" value="Masculino">
        <label for="masculino">Masculino</label > <br>

        <input type="radio" id="feminino" name="userSexo" value="Feminino">
        <label for="feminino">Feminino</label> <br>

        <label for="interesses">Interesses: </label> <br>
        <input type="text" id="interesses" name="userInteresses" > <br>

        <label for="comentarios">Comentários: </label> <br>
        <input type="text" id="comentarios" name="userComentarios"> <br>

        <label for="upload">Upload de foto: </label> <br>
        <input type="file" id="imagem" name="userImagem"> <br> <br>

        <button type="submit" class="botao-enviar">Enviar</button>
    </form>
    
</body>
</html>
